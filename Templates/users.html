{% extends "base.html" %}

{% block content %}

<h2>User Management</h2>

<h3>Create User</h3>

<form method="post">

Name<br>
<input name="name"><br><br>

User ID<br>
<input name="user_id"><br><br>

Password<br>
<input name="password"><br><br>

Role<br>

<select name="role">

<option value="operator">Operator</option>
<option value="supervisor">Supervisor</option>
<option value="operation_management">Operation Management</option>
<option value="admin">Admin</option>

</select>

<br><br>

Section<br>
<input name="section">

<br><br>

<button type="submit">Create</button>

</form>

<hr>

<h3>User List</h3>

<table border="1">

<tr>

<th>Name</th>
<th>User ID</th>
<th>Role</th>
<th>Section</th>

</tr>

{% for u in users %}

<tr>

<td>{{u.full_name}}</td>
<td>{{u.user_id}}</td>
<td>{{u.role}}</td>
<td>{{u.section}}</td>

</tr>

{% endfor %}

</table>

{% endblock %}
