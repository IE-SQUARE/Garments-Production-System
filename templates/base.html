<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Production System</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef1f5;
        }

        /* ১. স্লিম টপবার ডিজাইন (আপনার দেওয়া কোড অনুযায়ী) */
        .navbar-custom {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 45px; /* স্লিম হাইট */
            background-color: #1a4d7c;
            display: flex;
            align-items: center;
            padding: 0 15px;
            box-sizing: border-box;
            z-index: 1001;
            overflow: hidden;
        }

        /* ২. লোগো সাইজ কন্ট্রোল - যেন বড় না হয় */
        .brand-section {
            display: flex;
            align-items: center;
            height: 100%;
            text-decoration: none;
        }

        .brand-section img {
            height: 30px !important; /* লোগো ছোট রাখার জন্য */
            width: auto !important;
            object-fit: contain;
        }

        .company-name {
            color: white;
            font-weight: bold;
            margin-left: 10px;
            font-size: 14px;
        }

        /* ৩. টপবার ডান পাশ (ইউজার ইনফো) */
        .user-section {
            margin-left: auto;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-section span {
            font-size: 13px;
        }

        .logout-icon {
            height: 20px;
            width: auto;
            filter: invert(1);
            vertical-align: middle;
        }

        /* ৪. সাইডবার স্টাইল */
        .sidebar {
            position: fixed;
            top: 45px; /* টপবারের হাইট অনুযায়ী */
            left: 0;
            width: 220px;
            height: calc(100vh - 45px);
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            z-index: 1000;
            border-right: 1px solid #ddd;
            overflow-y: auto;
        }

        .sidebar a {
            padding: 12px 20px;
            text-decoration: none;
            font-size: 14px;
            color: #333;
            display: block;
            font-weight: bold;
            border-bottom: 1px solid #e0e0e0;
            transition: 0.3s;
        }

        .sidebar a:hover {
            background-color: #1a5a8c;
            color: #ffffff;
        }

        /* ৫. মেইন কন্টেন্ট এরিয়া */
        .content {
            margin-left: 230px;
            margin-top: 60px; /* কন্টেন্ট ওপর থেকে গ্যাপ */
            padding: 20px;
        }

        /* ইনপুট বক্স ডিজাইন */
        input, select {
            width: 220px;
            height: 32px;
            padding: 3px 8px;
            font-size: 13px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <nav class="navbar-custom">
        <a href="/" class="brand-section">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="SQUARE">
            <span class="company-name">SQUARE DENIMS LIMITED</span>
        </a>

        <div class="user-section">
            <span>{{ name }}</span>
            <a href="/logout">
                <img src="{{ url_for('static', filename='logout.png') }}" class="logout-icon" alt="Logout">
            </a>
        </div>
    </nav>
    <div class="sidebar">
        <a href="/dashboard">Home</a>
        <a href="/entry">Data Entry</a>
        <a href="/create_batch">Batch Creation</a>
        <a href="/style_details">Style Details</a>
        <a href="/master_data">Style Update</a>

        <a href="#" onclick="toggleDry()">Dry Process Report</a>
        <div id="dryMenu" style="display:none; background: #e8e8e8;">
            <a href="/report" style="padding-left:40px;">Date Wise Report</a>
            <a href="/operator_status" style="padding-left:40px;">Operator Status</a>
        </div>

        {% if role == "admin" %}
        <a href="#" onclick="toggleAdmin()">Admin Panel</a>
        <div id="adminMenu" style="display:none; background: #e8e8e8;">
            <a href="/users" style="padding-left:40px;">User Management</a>
            <a href="/operators" style="padding-left:40px;">Operator Management</a>
            <a href="/shifts" style="padding-left:40px;">Shift Management</a>
        </div>
        {% endif %}
    </div>
    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

    <script>
        function toggleAdmin() {
            var menu = document.getElementById("adminMenu");
            menu.style.display = (menu.style.display === "none") ? "block" : "none";
        }

        function toggleDry() {
            var menu = document.getElementById("dryMenu");
            menu.style.display = (menu.style.display === "none") ? "block" : "none";
        }
    </script>

</body>
</html>
