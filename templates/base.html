<title>Production System</title>

<link rel="stylesheet" href="/static/style.css">

<style>

body{
margin:0;
font-family:Arial;
background:#eef1f5;
}

/* টপবার এবং সাইডবার দুটোর জন্যই একই নীল রং (#184d78) */

.topbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 60px;
    background: #184d78; /* আপনার পছন্দের নীল রং */
    color: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    box-sizing: border-box;
    z-index: 1000;
}

.sidebar {
    position: fixed;
    top: 60px;
    left: 0;
    width: 220px;
    height: calc(100vh - 60px);
    background: #184d78; /* টপবারের সাথে ম্যাচ করে এই রংটি দেওয়া হলো */
    padding-top: 20px;
    display: flex;
    flex-direction: column;
    box-shadow: 2px 0 5px rgba(0,0,0,0.1);
}

.sidebar a {
    padding: 12px 20px;
    text-decoration: none;
    font-size: 15px;
    color: #ffffff; /* লেখা সাদা দেখানোর জন্য */
    display: block;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1); /* হালকা বর্ডার */
}

.sidebar a:hover {
    background: rgba(255, 255, 255, 0.1); /* মাউস নিলে হালকা উজ্জ্বল হবে */
    color: #3498db;
}
/* কন্টেন্ট এরিয়া ঠিক করার জন্য */
.content {
    margin-left: 230px; /* সাইডবারের জায়গাটুকু বাদ দিয়ে কন্টেন্ট শুরু হবে */
    padding: 20px;
    margin-top: 70px;
}

</style>

</head>

<body>

<div class="topbar">

<div class="top-left">

<img src="{{ url_for('static', filename='logo.png') }}" class="logo">

<span class="company-name">
SQUARE DENIMS LIMITED
</span>

</div>

<div class="top-right">

<span class="user-name">{{name}}</span>

<a href="/logout" class="logout-btn">
<img src="{{ url_for('static', filename='logout.png') }}" class="logout-icon">
</a>

</div>

</div>


<div class="sidebar">

<a href="/dashboard">Home</a>
<a href="/entry">Data Entry</a>
<a href="/create_batch">Batch Creation</a>

<a href="/master_data">Style Update</a>

<a href="#" onclick="toggleDry()">Dry Process Report</a>

<div id="dryMenu" style="display:none;">
<a href="/report" style="padding-left:40px;">Date Wise Report</a>
<a href="/operator_status" style="padding-left:40px;">Operator Status</a>
</div>

{% if role == "admin" %}

<a href="#" onclick="toggleAdmin()">Admin Panel</a>

<div id="adminMenu" style="display:none;">
<a href="/users" style="padding-left:40px;">User Management</a>
<a href="/operators" style="padding-left:40px;">Operator Management</a>
<a href="/shifts" style="padding-left:40px;">Shift Management</a>
</div>

{% endif %}

</div><a href="/users">User Management</a>
<a href="/shifts">Shift Management</a>

</div>


<div class="content">

{% block content %}
{% endblock %}

</div>

<script>

function toggleAdmin(){

var menu = document.getElementById("adminMenu");

if(menu.style.display === "none"){
menu.style.display = "block";
}
else{
menu.style.display = "none";
}

}

function toggleDry(){

var menu = document.getElementById("dryMenu");

if(menu.style.display === "none"){
menu.style.display = "block";
}
else{
menu.style.display = "none";
}

}

</script>

</body>
</html>
