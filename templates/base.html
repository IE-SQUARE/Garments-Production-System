<!DOCTYPE html>
<html>
<head>

<style>

body{
margin:0;
padding:0;
}

.content{
margin:10px;
padding:5px;
}

.main-content{
margin-left:20px;
padding:15px;
}

input, select{

width:220px;
height:36px;

padding:3px 8px;

font-size:14px;

border:px solid #999;

box-sizing:border-box;

}

.master-box{

width:480px;

}

button{

margin-top:10px;

padding:8px 20px;

font-size:14px;

cursor:pointer;

}

</style>

<title>Production System</title>

<link rel="stylesheet" href="/static/style.css">

<style>

body{
margin:0;
font-family:Arial;
background:#eef1f5;
}

.topbar{
position:fixed;
top:0;
left:0;
width:100%;
height:45px;
background:#184d78;
color:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 25px;
box-sizing:border-box;
z-index:1000;
}

.top-left{
display:flex;
align-items:center;
gap:12px;
}

.logo{
height:52px;
}

.company-name{
font-size:18px;
font-weight:bold;
letter-spacing:1px;
}

.top-right{
display:flex;
align-items:center;
gap:15px;
}

.user-name{
font-size:16px;
font-weight:bold;
}

.logout-icon{
height:28px;
cursor:pointer;
}

.sidebar{
position:fixed;
top:60px;
left:0;
width:220px;
height:100vh;
background:#f7f8fb;
border-right:1px solid #ddd;
}

.sidebar a{
display:block;
padding:14px 20px;
text-decoration:none;
color:#184d78;
font-weight:bold;
}

.sidebar a:hover{
background:#e7f0f8;
}

.content{
margin-left:240px;
margin-top:80px;
padding:30px;
}

</style>

</head>

<body>

<div class="topbar">

<div class="top-left">

<img src="{{ url_for('static', filename='logo.png') }}" class="logo">

<span class="company-name">
SQUARE DENIMS LIMITED
</span>

</div>

<div class="top-right">

<span class="user-name">{{name}}</span>

<a href="/logout" class="logout-btn">
<img src="{{ url_for('static', filename='logout.png') }}" class="logout-icon">
</a>

</div>

</div>


<div class="sidebar">

<a href="/dashboard">Home</a>
<a href="/entry">Data Entry</a>
<a href="/create_batch">Batch Creation</a>

<a href="/master_data">Style Update</a>

<a href="#" onclick="toggleDry()">Dry Process Report</a>

<div id="dryMenu" style="display:none;">
<a href="/report" style="padding-left:40px;">Date Wise Report</a>
<a href="/operator_status" style="padding-left:40px;">Operator Status</a>
</div>

{% if role == "admin" %}

<a href="#" onclick="toggleAdmin()">Admin Panel</a>

<div id="adminMenu" style="display:none;">
<a href="/users" style="padding-left:40px;">User Management</a>
<a href="/operators" style="padding-left:40px;">Operator Management</a>
<a href="/shifts" style="padding-left:40px;">Shift Management</a>
</div>

{% endif %}

</div><a href="/users">User Management</a>
<a href="/shifts">Shift Management</a>

</div>


<div class="content">

{% block content %}
{% endblock %}

</div>

<script>

function toggleAdmin(){

var menu = document.getElementById("adminMenu");

if(menu.style.display === "none"){
menu.style.display = "block";
}
else{
menu.style.display = "none";
}

}

function toggleDry(){

var menu = document.getElementById("dryMenu");

if(menu.style.display === "none"){
menu.style.display = "block";
}
else{
menu.style.display = "none";
}

}

</script>

</body>
</html>
