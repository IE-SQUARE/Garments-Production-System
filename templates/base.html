<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production System</title>
    <style>
        /* ১. বেসিক রিসেট */
        body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: #eef1f5; overflow-x: hidden; }

        /* ২. টপবার - একদম ফিক্সড এবং স্লিম (৪৫ পিক্সেল) */
        .navbar-custom {
            position: fixed; top: 0; left: 0; width: 100%; height: 45px;
            background-color: #1a4d7c; display: flex; align-items: center;
            padding: 0 15px; box-sizing: border-box; z-index: 2000;
        }

        /* মোবাইল মেনু বাটন - পিসিতে হিডেন থাকবে */
        .menu-btn {
            display: none; color: white; font-size: 22px; cursor: pointer; margin-right: 12px;
        }

        .brand-section { display: flex; align-items: center; text-decoration: none; }
        .brand-section img { height: 28px; width: auto; }
        .company-name { color: white; font-weight: bold; margin-left: 10px; font-size: 14px; white-space: nowrap; }

        /* ৩. সাইডবার - পিসিতে বাম পাশে ফিক্সড */
        .sidebar {
            position: fixed; top: 45px; left: 0; width: 220px;
            height: calc(100vh - 45px); background-color: #f4f4f4;
            display: flex; flex-direction: column; z-index: 1500;
            border-right: 1px solid #ddd; overflow-y: auto; transition: 0.3s ease;
        }

        .sidebar a {
            padding: 12px 20px; text-decoration: none; font-size: 14px;
            color: #333; display: block; font-weight: bold; border-bottom: 1px solid #e0e0e0;
        }

        .sidebar a:hover { background-color: #1a5a8c; color: white; }

        /* ৪. মেইন কন্টেন্ট এরিয়া */
        .content { margin-left: 220px; margin-top: 45px; padding: 20px; min-height: 100vh; box-sizing: border-box; }

        /* ৫. মোবাইল রেসপন্সিভ সেটিংস - কোনো কিছু যেন উল্টাপাল্টা না হয় */
        @media (max-width: 768px) {
            .menu-btn { display: block; } /* মোবাইলে মেনু বাটন দেখাবে */
            
            .sidebar {
                left: -220px; /* মোবাইলে মেনু বামে লুকানো থাকবে */
                width: 220px;
                box-shadow: 5px 0 15px rgba(0,0,0,0.2);
            }

            .sidebar.active { left: 0; } /* বাটন টিপলে মেনু স্লাইড করে আসবে */

            .content { margin-left: 0 !important; padding: 15px; } /* মোবাইলে কন্টেন্ট ফুল স্ক্রিন */
            
            .company-name { display: none; } /* মোবাইলে নাম হাইড থাকবে লোগোর জায়গা বাঁচাতে */

            /* ইনপুট বক্স মোবাইলে সুন্দর দেখানোর জন্য */
            input, select, button { width: 100% !important; height: 40px !important; margin-bottom: 10px !important; }
        }

        .user-section { margin-left: auto; color: white; display: flex; align-items: center; gap: 8px; }
        .logout-icon { height: 18px; filter: invert(1); cursor: pointer; }
    </style>
</head>
<body>

    <nav class="navbar-custom">
        <div class="menu-btn" onclick="toggleSidebar()">☰</div>
        <a href="/" class="brand-section">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo">
            <span class="company-name">SQUARE DENIMS LIMITED</span>
        </a>
        <div class="user-section">
            <span style="font-size: 12px; font-weight: bold;">{{ name }}</span>
            <a href="/logout"><img src="{{ url_for('static', filename='logout.png') }}" class="logout-icon"></a>
        </div>
    </nav>

    <div class="sidebar" id="sidebar">
        <a href="/dashboard">Home</a>
        <a href="/entry">Data Entry</a>
        <a href="/create_batch">Batch Creation</a>
        <a href="/style_details">Style Details</a>
        <a href="{{ url_for('set_hourly_target') }}" class="nav-link">
            <i class="fa fa-crosshairs"></i> Set Hourly Target
        </a>
        <a href="/master_data">Style Update</a>

        <a href="#" onclick="toggleSub('dryMenu')">Dry Process Report ▾</a>
        <div id="dryMenu" style="display:none; background: #e9ecef;">
            <a href="/report" style="padding-left:35px; font-size: 13px;">Date Wise Report</a>
            <a href="/operator_status" style="padding-left:35px; font-size: 13px;">Operator Status</a>
        </div>

        {% if role == "admin" %}
        <a href="#" onclick="toggleSub('adminMenu')">Admin Panel ▾</a>
        <div id="adminMenu" style="display:none; background: #e9ecef;">
            <a href="/users" style="padding-left:35px; font-size: 13px;">User Management</a>
            <a href="/operators" style="padding-left:35px; font-size: 13px;">Operator Management</a>
        </div>
        {% endif %}
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>

    <script>
        // মোবাইল সাইডবার টগল
        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("active");
        }

        // সাব-মেনু টগল (রিপোর্ট এবং এডমিন)
        function toggleSub(menuId) {
            var menu = document.getElementById(menuId);
            menu.style.display = (menu.style.display === "none" || menu.style.display === "") ? "block" : "none";
        }

        // মোবাইলে বাইরে ক্লিক করলে মেনু বন্ধ হওয়া
        document.addEventListener('click', function(event) {
            var sidebar = document.getElementById('sidebar');
            var menuBtn = document.querySelector('.menu-btn');
            if (window.innerWidth <= 768) {
                if (!sidebar.contains(event.target) && !menuBtn.contains(event.target)) {
                    sidebar.classList.remove('active');
                }
            }
        });
    </script>
</body>
</html>
