{% extends "base.html" %}{% block content %}<style>table{width:100%;table-layout:fixed;border-collapse:collapse;}td, th{padding:0;margin:0;text-align:center;vertical-align:middle;height:30px;}.table-input{width:100%;height:26px;padding:0 4px;font-size:12px;box-sizing:border-box;border:1px solid #999;}.sl-cell{line-height:30px;font-weight:bold;}.action-btn{width:26px;height:26px;background:red;color:white;border:none;display:flex;align-items:center;justify-content:center;margin:auto;cursor:pointer;}</style><h2>PROCESS WISE TARGET</h2><form method="get"><select name="style_label" style="width:400px;height:35px;">{% for r in master_rows %}<option value="{{r.label}}">{{r.label}}</option>{% endfor %}</select><button type="submit">Search</button></form><hr><form method="post" onsubmit="return validateForm()"><input type="hidden" name="style_label" value="{{request.args.get('style_label')}}"><div style="overflow-x:auto;"><table border="1"><tr><th style="width:50px;">SL</th><th style="width:120px;">Section</th><th style="width:250px;">Operation</th><th style="width:70px;">Seq</th><th style="width:70px;">SAM</th><th style="width:90px;">Batch Time</th><th style="width:80px;">Qty</th><th style="width:90px;">Weight</th><th style="width:80px;">Batch</th><th style="width:80px;">Target</th><th style="width:90px;">Water</th><th style="width:70px;">Action</th></tr><tbody id="tableBody"><tr><td class="sl-cell">1</td><td><select name="section[]" class="table-input" onchange="loadOperations(this)"><option value="">Select</option><option>Whisker</option><option>Brushing</option><option>Laser</option><option>Special Process</option><option>Spray</option><option>3d</option><option>Wet Process</option></select></td><td><select name="operation[]" class="table-input operation-dropdown"><option value="">Select</option></select></td><td><input name="seq[]" class="table-input"></td><td><input name="sam[]" class="table-input"></td><td><input name="batch_time[]" class="table-input"></td><td><input name="qty[]" class="table-input"></td><td><input name="weight[]" class="table-input"></td><td><input name="no_batch[]" class="table-input"></td><td><input name="target[]" class="table-input"></td><td><input name="water[]" class="table-input"></td><td><button type="button" class="action-btn" onclick="removeRow(this)">X</button></td></tr></tbody></table></div><br><button type="button" onclick="addRow()">+ Add Row</button><br><br><button type="submit" style="background:green;color:white;height:35px;width:120px;">Update</button></form><script>// 🔥 OPERATION LOADfunction loadOperations(sectionSelect){let section = sectionSelect.value;let row = sectionSelect.closest("tr");let operationDropdown = row.querySelector(".operation-dropdown");operationDropdown.innerHTML = "<option>Loading...</option>";fetch("/get_operations/" + section).then(res => res.json()).then(data => {operationDropdown.innerHTML = "<option value=''>Select</option>";data.forEach(item => {let opt = document.createElement("option");opt.value = item.name;opt.text = item.name;operationDropdown.appendChild(opt);});});}// 🔥 VALIDATIONfunction validateForm(){let rows = document.querySelectorAll("#tableBody tr");for(let row of rows){let section = row.querySelector("select[name='section[]']").value;let batchTime = row.querySelector("input[name='batch_time[]']").value;let qty = row.querySelector("input[name='qty[]']").value;let weight = row.querySelector("input[name='weight[]']").value;let batch = row.querySelector("input[name='no_batch[]']").value;let water = row.querySelector("input[name='water[]']").value;if(section === "Wet Process"){if(!batchTime || !qty || !weight || !batch || !water){alert("⚠️ Wet Process এর জন্য সব field fill করতে হবে");return false;}}}return true;}// 🔥 SERIALfunction updateSerial(){let rows = document.querySelectorAll("#tableBody tr");rows.forEach((row,index)=>{row.cells[0].innerText = index+1;});}// 🔥 ADD ROWfunction addRow(){let table = document.getElementById("tableBody");let row = table.insertRow();row.innerHTML = `<td class="sl-cell"></td><td><select name="section[]" class="table-input" onchange="loadOperations(this)"><option value="">Select</option><option>Whisker</option><option>Brushing</option><option>Laser</option><option>Special Process</option><option>Spray</option><option>3d</option><option>Wet Process</option></select></td><td><select name="operation[]" class="table-input operation-dropdown"><option value="">Select</option></select></td><td><input name="seq[]" class="table-input"></td><td><input name="sam[]" class="table-input"></td><td><input name="batch_time[]" class="table-input"></td><td><input name="qty[]" class="table-input"></td><td><input name="weight[]" class="table-input"></td><td><input name="no_batch[]" class="table-input"></td><td><input name="target[]" class="table-input"></td><td><input name="water[]" class="table-input"></td><td><button type="button" class="action-btn" onclick="removeRow(this)">X</button></td>`;updateSerial();}// 🔥 REMOVEfunction removeRow(btn){btn.closest("tr").remove();updateSerial();}window.onload = function(){updateSerial();}</script>{% endblock %}
