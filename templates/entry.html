{% extends "base.html" %}

{% block content %}

<style>
    /* ১. লেআউট এবং কন্টেইনার সেটআপ */
    .entry-container {
        max-width: 1000px;
        margin: 20px 0;
    }

    /* ২. প্রতিটি রো (Row) এর জন্য ফ্লেক্সিবক্স */
    .form-row {
        display: flex;
        gap: 20px;
        margin-bottom: 20px;
        align-items: flex-end; /* লেবেল ও বক্স নিচ থেকে সমান রাখবে */
    }

    /* ৩. প্রতিটি ইনপুট গ্রুপের স্টাইল */
    .form-group {
        display: flex;
        flex-direction: column;
        flex: 1; /* সমান জায়গা নিবে */
    }

    /* ৪. বক্সগুলোর হাইট এবং বর্ডার সমান করা (খুবই গুরুত্বপূর্ণ) */
    .form-group label {
        font-weight: bold;
        margin-bottom: 5px;
        font-size: 14px;
    }

    .form-group input, 
    .form-group select {
        height: 38px !important; /* সব বক্সের হাইট এক থাকবে */
        padding: 6px 12px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box; /* প্যাডিং যেন সাইজ নষ্ট না করে */
        width: 100%;
        background-color: #fff;
    }

    /* ৫. বড় বক্সের জন্য স্পেশাল উইডথ (Buyer/Style/Color/Item) */
    .flex-2 {
        flex: 2 !important;
    }

    /* ৬. সেভ বাটন ডিজাইন */
    .save-btn {
        padding: 8px 25px;
        height: 40px;
        background-color: #f8f9fa;
        border: 1px solid #adadad;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
    }

    .save-btn:hover {
        background-color: #e2e6ea;
    }
</style>

<div class="entry-container">
    <h2>Production Entry</h2>

    <form method="post">
        <div class="form-row">
            <div class="form-group">
                <label>Date</label>
                <input type="date" name="entry_date" value="{{ today }}">
            </div>

            <div class="form-group">
                <label>Section</label>
                <select name="section" id="sectionSelect">
                    <option value="">Select Section</option>
                    {% for s in sections %}
                    <option value="{{ s.section }}" {% if session.get('section') == s.section %}selected{% endif %}>
                        {{ s.section }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Process</label>
                <select name="process_id" id="processSelect">
                    {% for p in processes %}
                    <option value="{{ p.id }}">{{ p.process_name }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Operator</label>
                <input list="operators" name="operator_name" placeholder="Type or Select Operator">
                <datalist id="operators">
                    {% for o in operators %}
                    <option value="{{ o.operator_name }} - {{ o.operator_id }}">
                    {% endfor %}
                </datalist>
            </div>

            <div class="form-group flex-2">
                <label>Buyer / Style / Color / Item</label>
                <input list="masters" name="master_label" placeholder="Search Master Data">
                <datalist id="masters">
                    {% for m in master_rows %}
                    <option value="{{ m.label }}">
                    {% endfor %}
                </datalist>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group" style="max-width: 300px;">
                <label>Production Qty</label>
                <input type="number" name="qty" required placeholder="Enter Quantity">
            </div>
            <div class="form-group">
                <button type="submit" class="save-btn">Save Entry</button>
            </div>
            <div class="form-group"></div> </div>
    </form>
</div>

<script>
    document.getElementById("sectionSelect").addEventListener("change", function(){
        let section = this.value;
        fetch("/get_processes/" + section)
        .then(response => response.json())
        .then(data => {
            let processDropdown = document.getElementById("processSelect");
            processDropdown.innerHTML = "";
            data.forEach(function(p){
                let option = document.createElement("option");
                option.value = p.id;
                option.text = p.process_name;
                processDropdown.appendChild(option);
            });
        });
    });
</script>

{% endblock %}
