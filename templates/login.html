<!DOCTYPE html>
<html>

<head>

<title>Login</title>

<style>

body{
background:#345f7a;
font-family:Arial;
margin:0;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
}

.login-box{
width:420px;
background:#e9e9e9;
padding:40px;
border-radius:12px;
box-shadow:0 8px 25px rgba(0,0,0,0.25);
}

.login-header{
display:flex;
align-items:center;
justify-content:center;
gap:12px;
margin-bottom:25px;
}

.login-logo{
height:60px;
}

.login-header h2{
margin:0;
font-size:24px;
letter-spacing:1px;
}

.login-box input{
width:100%;
padding:12px;
margin-top:12px;
border-radius:6px;
border:1px solid #ccc;
}

.login-box button{
width:100%;
padding:12px;
margin-top:20px;
background:#184d78;
color:white;
border:none;
border-radius:6px;
font-weight:bold;
cursor:pointer;
}

</style>

</head>

<body>

<div class="login-box">

<form method="POST">

<div class="login-header">
<img src="/static/logo.png" class="login-logo">
<h2>SQUARE DENIMS LIMITED</h2>
</div>

<input type="text" name="user_id" placeholder="User ID" required>
<input type="password" name="password" placeholder="Password" required>

<button type="submit">LOGIN</button>

</form>

</div>

</body>

</html>
